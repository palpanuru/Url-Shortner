# Local stack: the service on PostgreSQL. `docker compose up --build`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener   # local only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/shortener
      DB_USER: shortener
      DB_PASSWORD: shortener
      APP_BASE_URL: http://localhost:8080
    ports: ["8080:8080"]
