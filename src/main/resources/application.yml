spring:
  application:
    name: url-shortener
  datasource:
    # Zero-setup default: in-memory H2 in PostgreSQL mode. Use the "postgres" profile for a real DB.
    url: jdbc:h2:mem:shortener;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, never by Hibernate
  flyway:
    enabled: true
  # Note: spring.mvc.problemdetails.enabled is deliberately left off. GlobalExceptionHandler owns
  # error mapping; enabling Boot's handler too makes two advices compete for the same exceptions.

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  code-length: 7
  max-code-generation-attempts: 5
  analytics:
    threads: 2
    queue-capacity: 10000
    max-window-days: 90
  links:
    default-ttl: 365d
    max-ttl: 730d
    purge-after: 30d
    block-private-addresses: true
    blocked-domains: []        # stand-in for a threat-intel / Safe Browsing integration
    purge:
      enabled: true
      cron: "0 15 3 * * *"
  security:
    # SHA-256 of each API key. The demo key below is "demo-key-change-me" - LOCAL USE ONLY.
    # Override in any shared environment via APP_SECURITY_APIKEYS_0_CLIENTID / APP_SECURITY_APIKEYS_0_SHA256.
    api-keys:
      - client-id: demo
        sha256: 090d1548c9d65f413a1a2c828a0bee3a7ae02d2137caf51e6029e6c3cb1f1fa4
  rate-limit:
    enabled: true
    create:
      capacity: 20
      per-minute: 60
    redirect:
      capacity: 200
      per-minute: 1200
