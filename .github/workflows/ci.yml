name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: build, test, coverage, static analysis
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shortener
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortener" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Gate 1-3: unit + integration tests (H2), JaCoCo >= 80% lines, SpotBugs + FindSecBugs.
      - run: mvn -B -ntp verify
      # Gate 4: same test suite against real PostgreSQL (migrations + SQL dialect).
      - name: test against PostgreSQL
        run: mvn -B -ntp test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shortener
          SPRING_DATASOURCE_USERNAME: shortener
          SPRING_DATASOURCE_PASSWORD: shortener
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            target/site/jacoco
            target/surefire-reports
            target/spotbugsXml.xml

  dependency-scan:
    name: dependency & config vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Gate 5: known-vulnerable dependencies (HIGH/CRITICAL fail the build) and Dockerfile misconfig.
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  container:
    name: container build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t url-shortener:${{ github.sha }} .
